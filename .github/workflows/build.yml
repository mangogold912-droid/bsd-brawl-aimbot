name: Build BSD Brawl Aimbot

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
        
    - name: Build native library
      run: |
        export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export TARGET=aarch64-linux-android21
        $ANDROID_NDK/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk

    - name: Download original APK
      run: wget -q -O bsd_brawl_plus.apk https://cloud.mysticte.ch/project_bsd/bsd_brawl_plus_v67.264.apk

    - name: Setup APK build tools
      run: |
        sudo apt-get update && sudo apt-get install -y default-jre
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.1/apktool_2.9.1.jar -O apktool.jar || wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.1.jar -O apktool.jar
        wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
        chmod +x apktool

    - name: Decompile APK
      run: java -jar apktool.jar d bsd_brawl_plus.apk -o apk_decompiled

    - name: Inject .so library
      run: |
        mkdir -p apk_decompiled/lib/arm64-v8a
        cp libs/arm64-v8a/libbsd_aimbot.so apk_decompiled/lib/arm64-v8a/

    - name: Recompile APK
      run: java -jar apktool.jar b apk_decompiled -o bsd_brawl_plus_mod.apk

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        find $ANDROID_SDK_ROOT -name zipalign -exec {} -v 4 bsd_brawl_plus_mod.apk bsd_brawl_plus_mod_aligned.apk \; || cp bsd_brawl_plus_mod.apk bsd_brawl_plus_mod_aligned.apk
        find $ANDROID_SDK_ROOT -name apksigner -exec {} sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out bsd_brawl_plus_signed.apk bsd_brawl_plus_mod_aligned.apk \;

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: bsd-brawl-mod-apk
        path: bsd_brawl_plus_signed.apk
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bsd-aimbot-lib
        path: libs/**/libbsd_aimbot.so
